    <link rel="icon" href="./shared/img/logo-icon.svg" />
    <style>
      :root { color-scheme: dark; --bg: #1b1525; --surface: #261e33; --text: #efedf4; --muted: #b3aebf; --accent: #f481b1; --border: rgba(255, 255, 255, 0.1); }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #f8f8f8; --surface: #ffffff; --text: #1e1e1e; --muted: #495057; --accent: #d81d73; --border: #dee2e6; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 46rem; margin: 0 auto; padding: 48px 16px; }
      h1 { font-family: 'Inter Tight', 'Inter', ui-sans-serif, sans-serif; font-size: 2rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 32px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      a { display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: inherit; text-decoration: none; }
      a:hover { border-color: var(--accent); }
      strong { display: block; font-size: 1.1rem; }
      span { color: var(--muted); font-size: 0.9rem; }
    </style>
    <script type="module">
      import '@fontsource/inter/400.css';
      import '@fontsource/inter-tight/700.css';
    </script>
  </head>
