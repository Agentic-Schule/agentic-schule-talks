# Baut die Talks und lädt dist/ zu Cloudflare Pages hoch (Projekt agentic-schule-talks).
# main geht als Produktion auf talks.agentic.schule, jeder andere Branch als Preview.
# Secrets: CLOUDFLARE_API_TOKEN (nur Cloudflare Pages: Edit) und CLOUDFLARE_ACCOUNT_ID.
# Actions sind per Commit-SHA gepinnt, wrangler per exakter Version.
name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: pages deploy dist --project-name=agentic-schule-talks --branch=${{ github.ref_name }} --commit-dirty=true
